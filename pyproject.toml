[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-movies-tv"
version = "0.1.0"
description = "Amazon Movies & TV 2018 — MongoDB, Neo4j, VADER — Bằng và Thuận"
requires-python = ">=3.11"
dependencies = ["pymongo==4.15.5", "neo4j==5.28.2", "Flask==3.1.2", "vaderSentiment==3.3.2", "python-dotenv==1.2.1", "requests==2.32.5", "pandas==2.3.3"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
moviesctl = "amazon_movies.cli:main"

[tool.setuptools.packages.find]
include = ["amazon_movies*"]

[tool.setuptools.package-data]
amazon_movies = ["templates/*.html", "static/*.js", "static/*.css", "static/vendor/*.js", "static/vendor/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
